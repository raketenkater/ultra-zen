# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: ultra-zen

before:
  hooks:
    - go mod tidy

builds:
  - id: ultra-zen
    main: ./cmd/ultra-zen
    binary: ultra-zen
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    # Tag-prefixed names (ultra-zen_v0.2.1_linux_amd64.tar.gz): install.sh
    # builds the same name from the release tag, so the two can never drift.
    # {{ .Version }} is the tag without the leading v — keep the literal v.
    name_template: >-
      {{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: raketenkater
    name: ultra-zen
