# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: ultra-zen

before:
  hooks:
    - go mod tidy

builds:
  - id: ultra-zen
    main: ./cmd/ultra-zen
    binary: ultra-zen
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: raketenkater
    name: ultra-zen
